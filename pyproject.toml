[project]
name = "reliable-llm-intake"
version = "0.1.0"
description = "Backend-first sample service for reliable LLM intake pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
